<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Finanzas</title>
    
    <!-- Configuración para PWA e Instalación Móvil -->
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finanzas">
    
    <!-- Generador dinámico de Manifest con Icono SVG -->
    <script>
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="%234f46e5"><rect width="512" height="512" rx="100" fill="%234f46e5"/><path fill="%23ffffff" d="M384 112H128c-26.5 0-48 21.5-48 48v192c0 26.5 21.5 48 48 48h256c26.5 0 48-21.5 48-48V160c0-26.5-21.5-48-48-48zm-32 192c-17.7 0-32-14.3-32-32s14.3-32 32-32 32 14.3 32 32-14.3 32-32 32z"/></svg>`;
        const iconUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(iconSvg);

        const manifest = {
            "name": "Control de Finanzas",
            "short_name": "Finanzas",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#4f46e5",
            "theme_color": "#4f46e5",
            "icons": [
                { "src": iconUrl, "sizes": "192x192", "type": "image/svg+xml", "purpose": "any maskable" },
                { "src": iconUrl, "sizes": "512x512", "type": "image/svg+xml", "purpose": "any maskable" }
            ]
        };

        const stringManifest = JSON.stringify(manifest);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>

    <!-- Tailwind CSS, Chart.js & FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-full flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 dark:bg-indigo-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white/10 p-2.5 rounded-xl">
                    <i class="fa-solid fa-wallet text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Mis Finanzas</h1>
                    <p class="text-xs text-indigo-200">Ingresos, Gastos y Calendario</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="pwa-install-btn" onclick="installPWA()" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg font-semibold text-sm shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> Instalar App
                </button>
                <button onclick="openModal()" class="bg-white text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-lg font-semibold text-sm shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nuevo
                </button>
                <button onclick="toggleDarkMode()" class="bg-indigo-700 hover:bg-indigo-800 p-2.5 rounded-lg text-sm transition">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6 overflow-y-auto">
        
        <!-- Columna Izquierda (Dashboard & Calendario) -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Tarjetas Dashboard -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Ingresos</p>
                        <h3 id="total-income" class="text-2xl font-bold text-emerald-600 mt-1">$0</h3>
                    </div>
                    <div class="bg-emerald-50 dark:bg-emerald-900/30 p-3 rounded-lg text-emerald-600">
                        <i class="fa-solid fa-arrow-trend-up text-xl"></i>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Gastos</p>
                        <h3 id="total-expense" class="text-2xl font-bold text-rose-600 mt-1">$0</h3>
                    </div>
                    <div class="bg-rose-50 dark:bg-rose-900/30 p-3 rounded-lg text-rose-600">
                        <i class="fa-solid fa-arrow-trend-down text-xl"></i>
                    </div>
                </div>

                <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-gray-500 dark:text-gray-400">Balance</p>
                        <h3 id="total-balance" class="text-2xl font-bold text-indigo-600 mt-1">$0</h3>
                    </div>
                    <div class="bg-indigo-50 dark:bg-indigo-900/30 p-3 rounded-lg text-indigo-600">
                        <i class="fa-solid fa-scale-balanced text-xl"></i>
                    </div>
                </div>
            </div>

            <!-- Calendario -->
            <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="calendar-month-year" class="text-lg font-semibold">Calendario Financiero</h2>
                    <div class="flex gap-1">
                        <button onclick="changeMonth(-1)" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-sm"><i class="fa-solid fa-chevron-left"></i></button>
                        <button onclick="changeMonth(1)" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-sm"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="grid grid-cols-7 text-center text-xs font-semibold text-gray-400 mb-2">
                    <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1 text-sm"></div>
            </div>

            <!-- Tabla de Transacciones -->
            <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                    <h2 class="text-lg font-semibold">Historial</h2>
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <input type="text" id="search-input" placeholder="Buscar..." oninput="renderTable()" class="w-full sm:w-48 px-3 py-1.5 text-sm bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 text-sm rounded-lg transition flex items-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-file-excel"></i> CSV
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 dark:bg-gray-900 text-gray-500 uppercase text-xs">
                            <tr>
                                <th class="p-3">Fecha</th>
                                <th class="p-3">Descripción</th>
                                <th class="p-3">Categoría</th>
                                <th class="p-3">Monto</th>
                                <th class="p-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-table-body" class="divide-y divide-gray-100 dark:divide-gray-700"></tbody>
                    </table>
                </div>
            </div>

        </div>

        <!-- Columna Derecha (Gráficos) -->
        <div class="space-y-6">
            <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                <h2 class="text-lg font-semibold mb-4">Gastos por Categoría</h2>
                <div class="relative h-64 flex justify-center items-center">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

            <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
                <h2 class="text-lg font-semibold mb-4">Comparativa Mensual</h2>
                <div class="relative h-64 flex justify-center items-center">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>

    </main>

    <!-- Modal Formulario -->
    <div id="transaction-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-700">
            <div class="p-5 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold">Nueva Transacción</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="transaction-form" onsubmit="saveTransaction(event)" class="p-5 space-y-4">
                <input type="hidden" id="tx-id">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Tipo</label>
                    <select id="tx-type" onchange="updateCategories()" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm">
                        <option value="expense">Gasto</option>
                        <option value="income">Ingreso</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Monto</label>
                    <input type="number" id="tx-amount" step="1" required placeholder="0" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Descripción</label>
                    <input type="text" id="tx-desc" required placeholder="Ej. Supermercado, Salario..." class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Categoría</label>
                    <select id="tx-category" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Fecha</label>
                    <input type="date" id="tx-date" required class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-sm rounded-lg font-medium">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg font-medium shadow">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Lógica e Instalación PWA -->
    <script>
        // --- REGISTRO DE SERVICE WORKER EN LÍNEA PARA PWA ---
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => self.clients.claim());
                self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
